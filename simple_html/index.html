<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pinko Game</title>
    <style>
        body {
            background-color: #000;
        }

        canvas {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            position: fixed;
            background-color: #111D28;
            border: 2px solid #fff;
            border-radius: 10px;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        #bet {
            position: fixed;
            top: 70%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #08E20B;
            border-radius: 10px;
            cursor: pointer;
            width: 800px;
            padding-top: 10px;
            padding-bottom: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: 500;
            font-family: Helvetica, sans-serif;
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="bet">Bet</div>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const DECIMAL_MULTIPLIER = 10000;

        const WIDTH = 800;
        const HEIGHT = 800;
        const ballRadius = 7;
        const obstacleRadius = 4;
        const gravity = pad(0.2);
        const horizontalFriction = 0.4;
        const verticalFriction = 0.8;
        let balls = [];

        const obstacles = [];
        const sinks = [];

        function pad(n) {
            return n * DECIMAL_MULTIPLIER;
        }

        function unpad(n) {
            return Math.floor(n / DECIMAL_MULTIPLIER);
        }

        const rows = 16;
        for (let row = 2; row < rows; row++) {
            const numObstacles = row + 1;
            const y = 0 + row * 35;
            const spacing = 36;
            for (let col = 0; col < numObstacles; col++) {
                const x = WIDTH / 2 - spacing * (row / 2 - col);
                obstacles.push({x: pad(x), y: pad(y), radius: obstacleRadius});
            }
        }

        const sinkWidth = 36;
        const NUM_SINKS = 15;
        for (let i = 0; i < NUM_SINKS; i++) {
            const x = WIDTH / 2 + (i - 7.5) * sinkWidth + obstacleRadius;
            const y = HEIGHT - 240;
            const width = sinkWidth;
            const height = width;
            sinks.push({x, y, width, height});
        }

        class Ball {
            constructor(x, y, radius, color) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.vx = 0;
                this.vy = 0;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(unpad(this.x), unpad(this.y), this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();
            }

            update() {
                this.vy = this.vy + gravity;
                this.x += this.vx;
                this.y += this.vy;

                obstacles.forEach((obstacle) => {
                    const dist = Math.hypot(this.x - obstacle.x, this.y - obstacle.y);
                    if (dist < pad(this.radius + obstacle.radius)) {
                        const angle = Math.atan2(
                            this.y - obstacle.y,
                            this.x - obstacle.x,
                        );
                        const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                        this.vx = Math.cos(angle) * speed * horizontalFriction;
                        this.vy = Math.sin(angle) * speed * verticalFriction;

                        const overlap = this.radius + obstacle.radius - unpad(dist);
                        this.x += pad(Math.cos(angle) * overlap);
                        this.y += pad(Math.sin(angle) * overlap);
                    }
                });

                sinks.forEach((sink) => {
                    if (
                        unpad(this.x) > sink.x - sink.width / 2 &&
                        unpad(this.x) < sink.x + sink.width / 2 &&
                        unpad(this.y) + this.radius > sink.y - sink.height / 2
                    ) {
                        this.vx = 0;
                        this.vy = 0;
                    }
                });
            }
        }

        const initialBall = new Ball(
            pad(WIDTH / 2 + 23),
            pad(50),
            ballRadius,
            "#fd630e",
        );
        balls.push(initialBall);

        function drawObstacles() {
            ctx.fillStyle = "white";
            obstacles.forEach((obstacle) => {
                ctx.beginPath();
                ctx.arc(
                    unpad(obstacle.x),
                    unpad(obstacle.y),
                    obstacle.radius,
                    0,
                    Math.PI * 2,
                );
                ctx.fill();
                ctx.closePath();
            });
        }

        function drawSinks() {
            ctx.fillStyle = "green";
            for (let i = 0; i < sinks.length; i++) {
                const sink = sinks[i];
                ctx.fillRect(
                    sink.x,
                    sink.y - sink.height / 2,
                    sink.width - obstacleRadius * 2,
                    sink.height,
                );
            }
        }

        function addBall() {
            const newBall = new Ball(
                pad(WIDTH / 2 + 13),
                pad(50),
                ballRadius,
                "#fd630e",
            );
            balls.push(newBall);
        }

        document.getElementById("bet").addEventListener("click", addBall);

        function draw() {
            ctx.clearRect(0, 0, WIDTH, HEIGHT);
            drawObstacles();
            drawSinks();
            balls.forEach((ball) => {
                ball.draw();
                ball.update();
            });
        }

        function update() {
            draw();
            requestAnimationFrame(update);
        }

        update();
    </script>
</body>

</html>
